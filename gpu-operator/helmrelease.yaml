# Generated by Cloud Native Stack
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gpu-operator
  namespace: flux-system
spec:
  interval: 10m
  targetNamespace: gpu-operator
  install:
    createNamespace: true
  chart:
    spec:
      chart: gpu-operator
      version: 25.10.1
      sourceRef:
        kind: HelmRepository
        name: helm-ngc-nvidia-com-nvidia
        namespace: flux-system
      interval: 5m
  dependsOn:
    - name: nodewright-customizations
  values:
    cdi:
      default: false
      enabled: true
    daemonsets:
      tolerations:
      - operator: Exists
    dcgm:
      enabled: true
    dcgmExporter:
      config:
        create: true
        name: dcgm-exporter
      serviceMonitor:
        enabled: true
        honorLabels: true
        interval: 30s
    devicePlugin:
      env:
      - name: DP_DISABLE_HEALTHCHECKS
        value: "109"
      - name: DEVICE_LIST_STRATEGY
        value: cdi-cri,cdi-annotations,volume-mounts
    driver:
      enabled: true
      maxParallelUpgrades: 5
      rdma:
        enabled: true
      useOpenKernelModules: true
      version: 580.105.08
    fullnameOverride: gpu-operator
    gdrcopy:
      enabled: true
    gfd:
      enabled: true
    hostPaths:
      driverInstallDir: /run/nvidia/driver
    migManager:
      enabled: true
    nfd:
      enabled: false
    operator:
      resources:
        limits:
          cpu: 500m
          memory: 700Mi
        requests:
          cpu: 200m
          memory: 300Mi
      tolerations:
      - operator: Exists
      upgradeCRD: true
    toolkit:
      enabled: true
      env:
      - name: ACCEPT_NVIDIA_VISIBLE_DEVICES_ENVVAR_WHEN_UNPRIVILEGED
        value: "false"
      - name: ACCEPT_NVIDIA_VISIBLE_DEVICES_AS_VOLUME_MOUNTS
        value: "true"
    validator:
      plugin:
        env:
        - name: WITH_WORKLOAD
          value: "false"

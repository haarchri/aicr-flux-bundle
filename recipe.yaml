kind: RecipeResult
apiVersion: aicr.nvidia.com/v1alpha1
metadata:
  version: v0.12.1-next
  appliedOverlays:
    - base
    - monitoring-hpa
    - eks
    - eks-training
    - h100-eks-training
    - h100-eks-ubuntu-training
criteria:
  service: eks
  accelerator: h100
  intent: training
  os: ubuntu
  platform: any
constraints:
  - name: K8s.server.version
    value: '>= 1.32.4'
  - name: OS.release.ID
    value: ubuntu
  - name: OS.release.VERSION_ID
    value: "24.04"
  - name: OS.sysctl./proc/sys/kernel/osrelease
    value: '>= 6.8'
componentRefs:
  - name: aws-ebs-csi-driver
    namespace: kube-system
    chart: aws-ebs-csi-driver
    type: Helm
    source: https://kubernetes-sigs.github.io/aws-ebs-csi-driver
    version: 2.59.0
    valuesFile: components/aws-ebs-csi-driver/values.yaml
  - name: aws-efa
    namespace: kube-system
    chart: aws-efa-k8s-device-plugin
    type: Helm
    source: https://aws.github.io/eks-charts
    version: v0.5.3
    valuesFile: components/aws-efa/values.yaml
  - name: cert-manager
    namespace: cert-manager
    chart: cert-manager
    type: Helm
    source: https://charts.jetstack.io
    version: v1.20.2
    valuesFile: components/cert-manager/values.yaml
  - name: gpu-operator
    namespace: gpu-operator
    chart: gpu-operator
    type: Helm
    source: https://helm.ngc.nvidia.com/nvidia
    version: v25.10.1
    valuesFile: components/gpu-operator/values-eks-training.yaml
    overrides:
      cdi:
        enabled: true
      gdrcopy:
        enabled: true
    dependencyRefs:
      - nfd
      - cert-manager
      - kube-prometheus-stack
      - nodewright-customizations
    manifestFiles:
      - components/gpu-operator/manifests/dcgm-exporter.yaml
  - name: k8s-ephemeral-storage-metrics
    namespace: monitoring
    chart: k8s-ephemeral-storage-metrics
    type: Helm
    source: https://jmcgrath207.github.io/k8s-ephemeral-storage-metrics/chart
    version: 1.19.2
    valuesFile: components/k8s-ephemeral-storage-metrics/values.yaml
    dependencyRefs:
      - kube-prometheus-stack
  - name: kai-scheduler
    namespace: kai-scheduler
    chart: kai-scheduler
    type: Helm
    source: oci://ghcr.io/kai-scheduler/kai-scheduler
    version: v0.14.1
    valuesFile: components/kai-scheduler/values.yaml
    dependencyRefs:
      - gpu-operator
  - name: kube-prometheus-stack
    namespace: monitoring
    chart: kube-prometheus-stack
    type: Helm
    source: https://prometheus-community.github.io/helm-charts
    version: 84.4.0
    valuesFile: components/kube-prometheus-stack/values.yaml
    overrides:
      prometheus:
        prometheusSpec:
          storageSpec:
            emptyDir: null
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 50Gi
  - name: nfd
    namespace: node-feature-discovery
    chart: node-feature-discovery
    type: Helm
    source: https://kubernetes-sigs.github.io/node-feature-discovery/charts
    version: 0.18.3
    valuesFile: components/nfd/values.yaml
    overrides:
      topologyUpdater:
        enable: true
  - name: nodewright-customizations
    namespace: skyhook
    type: Helm
    source: ""
    overrides:
      accelerator: h100
      intent: multiNodeTraining
      service: eks
    dependencyRefs:
      - nodewright-operator
    manifestFiles:
      - components/nodewright-customizations/manifests/tuning.yaml
  - name: nodewright-operator
    namespace: skyhook
    chart: skyhook-operator
    type: Helm
    source: https://helm.ngc.nvidia.com/nvidia/skyhook
    version: v0.15.1
    valuesFile: components/nodewright-operator/values.yaml
  - name: nvidia-dra-driver-gpu
    namespace: nvidia-dra-driver
    chart: nvidia-dra-driver-gpu
    type: Helm
    source: https://helm.ngc.nvidia.com/nvidia
    version: 25.12.0
    valuesFile: components/nvidia-dra-driver-gpu/values.yaml
    overrides:
      controller:
        affinity:
          nodeAffinity: null
    dependencyRefs:
      - gpu-operator
  - name: nvsentinel
    namespace: nvsentinel
    chart: nvsentinel
    type: Helm
    source: oci://ghcr.io/nvidia
    version: v1.3.0
    valuesFile: components/nvsentinel/values.yaml
    dependencyRefs:
      - cert-manager
      - gpu-operator
  - name: prometheus-adapter
    namespace: monitoring
    chart: prometheus-adapter
    type: Helm
    source: https://prometheus-community.github.io/helm-charts
    version: 5.3.0
    valuesFile: components/prometheus-adapter/values.yaml
    dependencyRefs:
      - kube-prometheus-stack
deploymentOrder:
  - aws-ebs-csi-driver
  - aws-efa
  - cert-manager
  - kube-prometheus-stack
  - k8s-ephemeral-storage-metrics
  - nfd
  - nodewright-operator
  - nodewright-customizations
  - gpu-operator
  - kai-scheduler
  - nvidia-dra-driver-gpu
  - nvsentinel
  - prometheus-adapter
validation:
  deployment:
    constraints:
      - name: Deployment.gpu-operator.version
        value: '>= v24.6.0'
    checks:
      - operator-health
      - expected-resources
      - gpu-operator-version
      - check-nvidia-smi
  performance:
    constraints:
      - name: nccl-all-reduce-bw
        value: '>= 300'
    checks:
      - nccl-all-reduce-bw
  conformance:
    checks:
      - platform-health
      - gpu-operator-health
      - dra-support
      - accelerator-metrics
      - ai-service-metrics
      - gang-scheduling
      - pod-autoscaling
      - cluster-autoscaling
      - robust-controller
      - secure-accelerator-access
